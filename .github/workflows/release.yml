name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --locked --release

      - name: Package release
        run: |
          mkdir -p dist/hanvon-tablet-driver
          cp target/release/hanvon-tablet-driver dist/hanvon-tablet-driver/
          cp -r deploy dist/hanvon-tablet-driver/
          cp install.sh README.md dist/hanvon-tablet-driver/
          tar -C dist -czf "hanvon-tablet-driver-${GITHUB_REF_NAME}-x86_64-linux.tar.gz" hanvon-tablet-driver

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/hanvon-tablet-driver-${GITHUB_REF_NAME}-x86_64-linux.tar.gz" \
            --generate-notes
